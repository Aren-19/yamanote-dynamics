[theme]
base = "light"
# Muted green accent. The bright uguisu is kept for the route line itself.
primaryColor = "#2E7D32"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8F9"
textColor = "#1A2027"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
