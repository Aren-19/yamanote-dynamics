name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # viz brings plotly and streamlit so the application
          # smoke tests run too. pywebview (the app extra) needs a
          # desktop toolkit and is not useful on a runner.
          pip install -e ".[dev,viz]"

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        # A floor rather than a target. It is set below current coverage so it
        # catches whole modules going untested, not small fluctuations.
        run: pytest --cov=tokyoline --cov-report=term-missing --cov-fail-under=80

      - name: Run analysis scripts
        # The scripts are the project's real output. They exercise far more of
        # the code than the unit tests and have caught encoding and import
        # regressions that the tests did not.
        run: |
          for s in smoke_check convergence validate fleet energy gradient restrictions coasting; do
            echo "--- $s ---"
            python "scripts/$s.py" > /dev/null
          done
