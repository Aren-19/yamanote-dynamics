name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        run: pytest

      - name: Run analysis scripts
        # The scripts are the project's real output. They exercise far more of
        # the code than the unit tests and have caught encoding and import
        # regressions that the tests did not.
        run: |
          for s in smoke_check convergence validate fleet energy gradient; do
            echo "--- $s ---"
            python "scripts/$s.py" > /dev/null
          done
