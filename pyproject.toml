[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokyoline"
version = "0.1.0"
description = "First-principles train dynamics for the Yamanote Line, validated against the published timetable"
requires-python = ">=3.10"
# scipy and matplotlib are deliberately absent. The original plan called for
# scipy for integration and root-finding, but the physics core ended up not
# needing it: the RK4 step is hand-rolled so control-phase switching stays
# explicit, the braking solution is closed-form, and the brake-application
# point is found by bisection. matplotlib was never imported at all.
# Declaring unused dependencies misstates what the project needs to run.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# The GUI needs these. `pip install -e ".[viz]"` to get them.
viz = ["plotly>=5.18", "streamlit>=1.30"]
# Optional: run the GUI in a native desktop window instead of a browser tab.
app = ["plotly>=5.18", "streamlit>=1.30", "pywebview>=4.4"]
# Test suite. `pip install -e ".[dev]"` then `pytest`.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # dict(...) is used deliberately for Plotly and Matplotlib keyword blocks,
    # where it reads better than a brace literal and diffs one line at a time.
    "C408",
    # Long explanatory lines in docstrings are the point of them.
    "E501",
    # Japanese terms and the per-mille sign are deliberate: they are the exact
    # words the sources use, and replacing them would obscure provenance.
    "RUF001", "RUF002", "RUF003",
    # zip() over successive pairs is clear as written; strict= adds noise to
    # comparisons of a list with its own tail, where lengths differ by design.
    "B905", "RUF007",
    # An explicit if/else reads better than a ternary inside the braking
    # integrator, where the two branches are ramp-up and ramp-down.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Scripts import after calling ensure(), which is the whole purpose of the guard.
"scripts/*" = ["E402"]
"app.py" = ["E402"]
"tests/*" = ["E402"]
